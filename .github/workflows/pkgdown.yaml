# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_DATATABLE_NUM_THREADS: 2
      OMP_THREAD_LIMIT: 2
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Add INLA repo
        run: |
          write('options(repos = c(INLA = "https://inla.r-inla-download.org/R/stable/", getOption("repos")))',
                file = path.expand("~/.Rprofile"), append = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Verify development site is separate
        run: |
          version <- read.dcf("DESCRIPTION")[1, "Version"]
          if (length(strsplit(version, ".", fixed = TRUE)[[1]]) == 4L) {
            stopifnot(file.exists("docs/dev/index.html"),
                      file.exists("docs/dev/articles/fisheries.html"),
                      !file.exists("docs/index.html"))
            article <- xml2::read_html("docs/dev/articles/fisheries.html")
            links <- xml2::xml_attr(xml2::xml_find_all(article, "//a[starts-with(@href, '#')]"), "href")
            ids <- xml2::xml_attr(xml2::xml_find_all(article, "//*[@id]"), "id")
            stopifnot(all(sub("^#", "", links) %in% c(ids, "")))
          }
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          # Keep released pages at the root when publishing docs/dev.
          clean: false
          branch: gh-pages
          folder: docs
